# PiBunny dnsmasq config -- written/overwritten by ATTACKMODE when an
# ethernet gadget is armed. Serves the target a 192.168.1.x address and
# records it in /var/lib/misc/dnsmasq.leases (GET TARGET_IP).
interface=usb0
bind-interfaces
dhcp-range=192.168.1.2,192.168.1.100,255.255.255.0,24h
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
